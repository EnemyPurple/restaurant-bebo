{% extends "base.html" %}
{% block title %}{{ SITE_NAME }} — Рассылка{% endblock %}
{% block content %}
  {% include "partials/page_hero.html" with badge="Новости" title="Рассылка" subtitle="Подпишитесь на афишу, акции и специальные предложения ресторана." %}

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0">
        <div class="card-body p-4">
          <form method="post" action="{% url 'newsletter:subscribe' %}" class="vstack gap-3">
            {% csrf_token %}
            <div>
              <label class="form-label" for="newsletter-email">Электронный адрес</label>
              <input
                type="email"
                class="form-control"
                id="newsletter-email"
                name="email"
                placeholder="your@email.com"
                required
                autocomplete="email"
              />
            </div>
            <button type="submit" class="wr-btn wr-btn--fill">Подписаться</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
