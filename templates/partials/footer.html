<footer class="bebo-site__footer">
  <div class="container">
    <div class="bebo-site__footer-inner">
      <div>
        <div class="bebo-site__footer-brand">{{ SITE_NAME }}</div>
        <div class="small text-muted">© {% now "Y" %} · {{ contact_settings.address }}</div>
      </div>
      <div class="bebo-site__footer-meta small">
        <a href="tel:{{ contact_settings.phone|cut:' '|cut:'-'|cut:'('|cut:')' }}">{{ contact_settings.phone }}</a>
        <span class="bebo-site__footer-sep">·</span>
        <span class="text-muted">{{ contact_settings.working_hours }}</span>
      </div>
    </div>
  </div>
</footer>
