<section class="wr-page-hero">
  {% if badge %}<div class="wr-page-hero__badge">{{ badge }}</div>{% endif %}
  <h1 class="wr-page-hero__title wr-serif">{{ title }}</h1>
  {% if subtitle %}<p class="text-muted mb-0">{{ subtitle }}</p>{% endif %}
  {% if action_url and action_text %}
    <a class="wr-link-arrow mt-3 d-inline-flex" href="{{ action_url }}">{{ action_text }}</a>
  {% endif %}
</section>
