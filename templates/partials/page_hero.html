<section class="bebo-page-hero mb-4">
  <div class="bebo-page-hero__inner">
    {% if badge %}<div class="bebo-page-hero__badge">{{ badge }}</div>{% endif %}
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div>
        <h1 class="bebo-page-hero__title">{{ title }}</h1>
        {% if subtitle %}<p class="bebo-page-hero__subtitle mb-0">{{ subtitle }}</p>{% endif %}
      </div>
      {% if action_url and action_text %}
        <a class="btn btn-sm btn-outline-secondary align-self-center" href="{{ action_url }}">{{ action_text }}</a>
      {% endif %}
    </div>
  </div>
</section>
