{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link href="{% static 'css/georgia-theme.css' %}?v={% now 'U' %}" rel="stylesheet" />
    {% block head %}{% endblock %}
  </head>
  <body class="bebo-site d-flex flex-column min-vh-100">
    <div id="beboScrollProgress" class="bebo-scroll-progress" aria-hidden="true"></div>
    {% include "partials/navbar.html" %}
    <main class="container py-4 flex-grow-1">
      {% include "partials/messages.html" %}
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (() => {
        const progress = document.getElementById("beboScrollProgress");
        if (!progress) return;

        const updateProgress = () => {
          const scrollTop = window.scrollY || document.documentElement.scrollTop;
          const scrollable = document.documentElement.scrollHeight - window.innerHeight;
          const ratio = scrollable > 0 ? Math.min(1, Math.max(0, scrollTop / scrollable)) : 0;
          progress.style.transform = `scaleX(${ratio})`;
        };

        updateProgress();
        window.addEventListener("scroll", updateProgress, { passive: true });
        window.addEventListener("resize", updateProgress);
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
