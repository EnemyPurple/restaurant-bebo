services:
  - type: web
    name: restaurant-bebo
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: REDIS_URL
        value: ""
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://restaurant-bebo.onrender.com
      - key: ADMIN_USERNAME
        value: qawsea
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
